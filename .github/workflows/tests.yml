name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    name: ci (${{ matrix.database.name }})
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: mysql
            image: mysql:8.4
            driver: mysql
            health_cmd: mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent
          - name: mariadb
            image: mariadb:11.4
            driver: mariadb
            health_cmd: healthcheck.sh --connect --innodb_initialized

    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: accounting_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health_cmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: ${{ matrix.database.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: accounting_system
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: bcmath, mbstring, pcntl, pdo_mysql, pdo_sqlite

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Verify database migrations
        run: php artisan migrate:status

      - name: Audit production dependencies
        run: composer audit --locked

      - name: Audit npm production dependencies
        run: npm audit --omit=dev

      - name: Run CI Checks
        run: composer ci:check

      - name: Run database concurrency tests
        run: php artisan test tests/Integration/ConcurrencySafetyTest.php --fail-on-skipped
